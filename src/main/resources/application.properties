# Roq POC - Aligned with domtrip website POC
# See https://iamroq.com/docs/ and https://docs.quarkiverse.io/quarkus-roq/

# Site
site.url=http://localhost:8080
site.content-dir=content
site.public-dir=public
site.page-layout=:theme/page

# Disable blog for docs-only POC
site.collections.posts=false

# Generator (static export; CI uses output-dir=roq)
quarkus.roq.generator.output-dir=roq
quarkus.roq.generator.batch=false

# Web bundler (match domtrip)
quarkus.web-bundler.node-modules=target
