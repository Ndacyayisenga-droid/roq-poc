<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{page.title}</title>

    <link rel="stylesheet" href="{site.url}css/docusaurus-style.css">
    <link rel="stylesheet" href="{site.url}css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="layout">
        <header class="header">
            <nav class="navbar">
                <div class="navbar-container">
                    <a href="{site.url}" class="navbar-brand">
                        <span class="navbar-title">Roq POC</span>
                    </a>
                    <button class="navbar-toggle" id="navbar-toggle">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <ul class="navbar-nav">
                        <li><a href="{site.url}docs/">Documentation</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="main-wrapper">
            <main class="main-content">
                <div class="content-wrapper">
                    {#insert /}
                </div>
            </main>
            <aside class="toc" id="toc">
                <div class="toc-title">On this page</div>
                <ul class="toc-nav" id="toc-nav"></ul>
            </aside>
        </div>

        <footer class="footer">
            <div class="footer-container">
                <div class="footer-grid">
                    <div class="footer-section">
                        <h4>Docs</h4>
                        <ul>
                            <li><a href="{site.url}docs/getting-started/">Getting Started</a></li>
                            <li><a href="{site.url}docs/code-examples/">Code Examples</a></li>
                            <li><a href="{site.url}docs/accessibility/">Accessibility</a></li>
                            <li><a href="{site.url}docs/asciidoc-example/">AsciiDoc example</a></li>
                        </ul>
                    </div>
                    <div class="footer-section">
                        <h4>Built with</h4>
                        <ul>
                            <li><a href="https://iamroq.com/">Quarkus Roq</a></li>
                        </ul>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>Roq POC Documentation. Built with ROQ.</p>
                </div>
            </div>
        </footer>
    </div>
    <script src="{site.url}js/layout.js"></script>
</body>
</html>
