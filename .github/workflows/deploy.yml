# Build Roq static site and deploy to GitHub Pages
# See https://iamroq.com/docs/publishing/ and https://docs.quarkiverse.io/quarkus-roq/dev/quarkus-roq-generator.html

name: Deploy Roq POC to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://ndacyayisenga-droid.github.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build static site with Roq generator
        run: |
          QUARKUS_ROQ_GENERATOR_BATCH=true mvn -B package quarkus:run -DskipTests \
            -Dquarkus.http.root-path=/roq-poc
        env:
          SITE_URL: https://ndacyayisenga-droid.github.io

      - name: Prepare for link check (MkDocs-style base path)
        run: |
          mkdir -p temp-root
          ln -s "$(pwd)/target/roq" temp-root/roq-poc

      - name: Link check (dead links, aligned with mkdocs-poc)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir temp-root
            --verbose --no-progress
            --exclude '127\.0\.0\.1'
            --exclude 'localhost'
            --exclude 'your-org\.github\.io'
            --exclude 'github\.com/your-org'
            --exclude 'httpbin\.org/status/404'
            --exclude 'ndacyayisenga-droid\.github\.io'
            --exclude 'file://'
            ./target/roq
          fail: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/roq

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
